<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elementia — Explore Every Element | ตารางธาตุ</title>
<meta name="description" content="Elementia ตารางธาตุออนไลน์ครบ 118 ธาตุ ค้นหาทันที ดูรายละเอียด สุ่มธาตุ สลับภาษา TH/EN | Interactive periodic table of all 118 elements.">
<meta property="og:title" content="Elementia — Explore Every Element">
<meta property="og:description" content="ตารางธาตุออนไลน์ 118 ธาตุ ค้นหา สุ่ม และเรียนรู้">
<meta property="og:type" content="website">
<meta name="theme-color" content="#f6f7f9">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Elementia","description":"Interactive periodic table of the elements","inLanguage":["th","en"]}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --ink:#14181f; --muted:#5c6572; --line:#dde1e7;
  --accent:hsl(222 70% 50%);
  --accent-text:color-mix(in srgb,var(--accent) 72%,#000);
  --accent-soft:color-mix(in srgb,var(--accent) 12%,var(--card));
  --tile-s:58%; --tile-l:90%; --tile-ink:#14181f;
  --radius:10px;
  --font:"IBM Plex Sans Thai","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0f1217; --card:#171b22; --ink:#eceff4; --muted:#9aa4b2; --line:#2a313c;
  --accent-text:color-mix(in srgb,var(--accent) 65%,#fff);
  --tile-s:34%; --tile-l:21%; --tile-ink:#eceff4;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.6;font-size:16px;
  transition:background-color .35s ease}
button,input,select{font:inherit;color:inherit}
option{color:var(--ink);background:var(--card)}
button{cursor:pointer}
a{color:var(--accent-text)}
:focus-visible{outline:3px solid var(--accent-text);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* header */
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:.6rem 1rem;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.6rem .8rem;align-items:center}
.brand{font-weight:700;font-size:1.25rem;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0}
.tools{display:flex;gap:.4rem;align-items:center;flex-wrap:nowrap}
.btn,.seg button,.ib{white-space:nowrap}
.btn.icon{min-width:40px;min-height:40px;width:40px;height:40px;padding:0;display:inline-grid;place-items:center;font-size:1.1rem;line-height:1}
.tools{gap:.35rem;align-items:center}
.tools .btn,.tools .seg{height:40px;min-height:40px;box-sizing:border-box}
.tools .btn.primary,#btnRandom{
  min-width:40px;width:40px;height:40px;padding:0;
  display:inline-grid;place-items:center;font-size:1.05rem;line-height:1;
  border-radius:999px;
}
.tools .seg{height:40px;align-items:stretch;padding:2px}
.tools .seg button{
  min-height:0;height:100%;min-width:36px;padding:0 .7rem;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:.8rem;line-height:1;
}
#btnDark{min-width:40px;width:40px;height:40px;padding:0;font-size:1.05rem}
.search input{min-width:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.4rem .85rem;min-height:40px;
  transition:transform .15s ease,border-color .15s ease}
.btn:hover{border-color:var(--accent-text)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:.4rem .7rem;min-height:38px;min-width:42px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{grid-column:1/-1;position:relative}
.search input{width:100%;min-height:46px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.55rem 2.6rem .55rem 2.4rem;font-size:1rem}
.search .ico{position:absolute;left:.85rem;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search .clear{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);border:0;background:transparent;width:36px;height:36px;border-radius:50%;color:var(--muted)}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:60vh;overflow:auto;padding:.3rem;z-index:30}
.results[hidden]{display:none}
.res{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:0;background:transparent;padding:.45rem .6rem;border-radius:8px;min-height:48px}
.res:hover,.res[aria-selected="true"]{background:var(--accent-soft)}
.res .sym{width:2.6rem;height:2.6rem;border-radius:8px;display:grid;place-items:center;font-weight:700;
  background:hsl(var(--h) var(--tile-s) var(--tile-l));color:var(--tile-ink)}
.res .nm{font-weight:600;line-height:1.25}
.res .sub{font-size:.85rem;color:var(--muted)}
.empty{padding:1.2rem;text-align:center;color:var(--muted)}

main{max-width:1180px;margin:0 auto;padding:1rem 1rem 3rem}
h1.title{font-size:clamp(1.5rem,4.5vw,2.3rem);line-height:1.2;margin:.8rem 0 .3rem;letter-spacing:-.015em}
p.lead{margin:0 0 1rem;color:var(--muted);max-width:60ch}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:.4rem;margin:0 0 1rem}
.chip{display:inline-flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.25rem .75rem;min-height:36px;font-size:.88rem}
.chip i{width:.8rem;height:.8rem;border-radius:50%;background:hsl(var(--h) 60% 55%);display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}

/* table */
.table-wrap{overflow-x:auto;padding-bottom:.6rem;-webkit-overflow-scrolling:touch}
.ptable{display:grid;grid-template-columns:repeat(18,minmax(44px,1fr));grid-template-rows:repeat(7,auto) .6rem repeat(2,auto);gap:4px;min-width:820px}
.tile{position:relative;border:1px solid transparent;border-radius:6px;aspect-ratio:1/1.08;padding:2px 3px;text-align:left;
  background:hsl(var(--h) var(--tile-s) var(--tile-l));color:var(--tile-ink);display:flex;flex-direction:column;justify-content:space-between;
  transition:transform .12s ease,opacity .2s ease,box-shadow .12s ease;overflow:hidden}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.16);z-index:2}
.tile .n{font-size:.62rem;opacity:.75;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .s{font-size:1.15rem;font-weight:700;line-height:1;text-align:center;letter-spacing:-.03em}
.tile .t{font-size:.56rem;line-height:1.15;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9;font-weight:500}
.tile.dim{opacity:.16;filter:saturate(.55)}
.tile.hit{outline:2.5px solid var(--ink);outline-offset:-2px;box-shadow:0 0 0 1px var(--bg)}
.tile .fav{position:absolute;top:1px;right:3px;font-size:.55rem}
.ph{border:1px dashed var(--line);border-radius:6px;display:grid;place-items:center;font-size:.6rem;color:var(--muted);text-align:center}
.hint{font-size:.85rem;color:var(--muted);margin:.4rem 0 0}
.emptybox{
  border:1px dashed color-mix(in srgb,var(--line) 85%,var(--muted));
  border-radius:14px;padding:1.15rem 1rem;color:var(--muted);text-align:center;
  background:color-mix(in srgb,var(--card) 55%,transparent);
  font-size:.9rem;line-height:1.45;
}
.emptybox .eb-ico{font-size:1.45rem;display:block;margin-bottom:.35rem;opacity:.75}
.emptybox .eb-act{display:inline-block;margin-top:.5rem;font-weight:650;color:var(--accent-text);font-size:.88rem}
.results .res-hint{
  padding:.5rem .7rem .25rem;font-size:.7rem;font-weight:650;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);
}
.sheet-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0 0}
.sheet-chips .schip{
  font-size:.75rem;font-weight:600;padding:.18rem .6rem;border-radius:999px;
  background:var(--accent-soft);color:var(--accent-text);
  border:1px solid color-mix(in srgb,var(--accent) 20%,transparent);
}

/* accordion */
.acc{margin-top:1rem;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.acc summary{cursor:pointer;list-style:none;padding:.9rem 1rem;font-weight:600;font-size:1.05rem;display:flex;justify-content:space-between;align-items:center;min-height:52px}
.acc summary::-webkit-details-marker{display:none}
.acc summary::after{content:"";width:9px;height:9px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(45deg);transition:transform .2s;margin:0 .3rem 0 .8rem}
.acc[open] summary::after{transform:rotate(-135deg)}
.acc-body{padding:0 1rem 1rem}
.note{text-wrap:pretty}
.pill{font-size:.78rem;font-weight:600;color:var(--accent-text);background:var(--accent-soft);border-radius:999px;padding:.1rem .65rem;margin-left:.6rem;white-space:nowrap}
.acc-body .lead{margin-bottom:.8rem}

/* ===== Learn hub — actually inviting ===== */
.learn-hub{
  margin:1.25rem 0 0;padding:1.15rem 1.1rem 1.2rem;border-radius:20px;
  border:1px solid var(--glass-line,var(--line));
  background:linear-gradient(155deg, color-mix(in srgb,var(--accent) 14%,var(--card)), var(--card) 55%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 10px 32px rgba(0,0,0,.07);
  position:relative;overflow:hidden;
  animation:viewIn .45s var(--ease-out) both;
}
.learn-hub .lh-actions .btn{
  transition:transform .32s var(--spring-soft), box-shadow .25s var(--ease), background .2s, filter .15s;
}
.learn-hub .lh-prog{
  transition:border-color .4s var(--ease-out), transform .35s var(--spring-soft);
}
.learn-hub .lh-prog:active{transform:scale(.94)}
.learn-hub::before{
  content:"";position:absolute;right:-30px;top:-40px;width:140px;height:140px;border-radius:50%;
  background:color-mix(in srgb,var(--accent) 18%,transparent);pointer-events:none;
}
.learn-hub .lh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.8rem;margin-bottom:.55rem;position:relative}
.learn-hub .lh-title{font-size:1.2rem;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.learn-hub .lh-sub{margin:.2rem 0 0;font-size:.88rem;color:var(--muted);line-height:1.4;max-width:42ch}
.learn-hub .lh-prog{
  flex:none;width:64px;height:64px;border-radius:50%;
  display:grid;place-items:center;position:relative;text-align:center;
  background:var(--card);border:2.5px solid color-mix(in srgb,var(--accent) 40%,var(--line));
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.learn-hub .lh-prog b{font-size:1.1rem;font-weight:700;line-height:1;color:var(--accent-text);display:block}
.learn-hub .lh-prog span{font-size:.6rem;color:var(--muted);font-weight:600}
.learn-hub .lh-teaser{
  margin:.55rem 0 .85rem;padding:.55rem .8rem;border-radius:12px;position:relative;
  background:color-mix(in srgb,var(--card) 75%,transparent);
  border:1px solid color-mix(in srgb,var(--accent) 16%,var(--line));
  font-size:.86rem;line-height:1.45;color:var(--ink);
}
.learn-hub .lh-teaser strong{color:var(--accent-text);font-weight:650}
.learn-hub .lh-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:.5rem;position:relative}
.learn-hub .lh-actions .btn{min-height:50px;font-weight:650;font-size:1rem}
.learn-hub .lh-actions .btn.primary{box-shadow:0 4px 16px color-mix(in srgb,var(--accent) 28%,transparent)}
@media(max-width:420px){
  .learn-hub .lh-actions{grid-template-columns:1fr}
  .learn-hub .lh-prog{width:56px;height:56px}
  .learn-hub .lh-prog b{font-size:1rem}
}
.sheet{overflow-x:hidden}
.body,.body>*,.card{min-width:0}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1 1 0;min-width:0;padding:.55rem .3rem;font-size:.95rem;white-space:normal;line-height:1.25}
.heatrow{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .7rem;margin:0 0 .8rem}
.heatrow label{flex:none;white-space:nowrap;font-size:.9rem;color:var(--muted)}
.heatrow select{flex:1 1 12rem;min-width:0;max-width:22rem;width:auto;text-overflow:ellipsis;border-radius:12px;padding:.5rem .8rem}
.heatrow #heatBar{flex:1 1 100%;margin:0}
.legend{min-width:0}
@media(min-width:760px) and (max-width:1100px){
  .heatrow select{max-width:18rem;flex:0 1 18rem}
  .top-in{padding:.55rem .9rem;gap:.5rem .6rem}
  .tools{gap:.35rem}
  .btn.primary{padding:.4rem .7rem}
}
.hero2{background:var(--accent-soft)}
.bignum{font-size:2.3rem;font-weight:700;line-height:1;color:var(--accent-text)}
.of{color:var(--muted);font-size:1rem;margin-left:.2rem}
.hero2 .pbar{height:10px;border-radius:5px;margin:.6rem 0 .9rem}
.hero2 .pbar i{border-radius:5px}
.stats3 .note{white-space:nowrap;font-size:.78rem}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;min-height:54px;font-size:1.1rem}
.qbox{background:var(--accent-soft);border-radius:16px;padding:1.1rem 1rem;margin:.7rem 0 .9rem;text-align:center}
.chips2{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.chip2{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.2rem .85rem;font-weight:600;font-size:.9rem;white-space:nowrap}
.timer{font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums}
.opt{display:flex;align-items:center;gap:.7rem}
.kb{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--accent-text)}
.fb{border-radius:14px;padding:.8rem 1rem;margin:.7rem 0}
.fb.ok{background:color-mix(in srgb,#1f9d55 16%,var(--card));border:1px solid #1f9d55}
.fb.bad{background:color-mix(in srgb,#d64545 14%,var(--card));border:1px solid #d64545}
.stack{display:grid;gap:.5rem}
.stack .btn,.stack select{width:100%;min-height:48px}
.resbox{text-align:center}
.resbox .stars{display:flex;justify-content:center;gap:.3rem;color:var(--accent-text)}
.resbox .stars svg{width:36px;height:36px}
.bigscore{font-size:2.6rem;font-weight:700;line-height:1.1;margin:.3rem 0}
#fPrev,#fNext{width:52px;height:52px;min-width:52px;border-radius:50%;padding:0;display:inline-grid;place-items:center}
.stats3{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:.5rem;text-align:center;margin:0 0 .8rem}
.stats3 b{display:block;font-size:1.15rem}
.lbar{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:.4rem}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;width:100%}
.two .btn{box-sizing:border-box;width:100%;min-width:0;min-height:48px;text-align:center;padding:.4rem .5rem;font-size:.95rem;line-height:1.25;white-space:normal;overflow-wrap:anywhere}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem}
.mode{min-width:0;overflow-wrap:anywhere;min-height:60px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:.6rem .8rem;text-align:left;font-weight:600;line-height:1.3}
.mode:hover{border-color:var(--accent-text)}
.pbar{height:6px;background:var(--line);border-radius:3px;margin:.5rem 0}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
/* lists */
.sec{margin-top:2rem}
.sec h2{font-size:1.15rem;margin:0 0 .6rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem}
.mini{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:.35rem .7rem .35rem .35rem;min-height:46px}
.mini b{width:2.2rem;height:2.2rem;border-radius:7px;display:grid;place-items:center;background:hsl(var(--h) var(--tile-s) var(--tile-l));color:var(--tile-ink)}
.mini:hover{border-color:var(--accent-text)}
footer .fdet summary{cursor:pointer;color:var(--accent-text);min-height:32px;display:flex;align-items:center}
footer .fdet ul{margin:.2rem 0 0;padding-left:1.1rem}
footer p,footer li{max-width:70ch}
footer{max-width:1180px;margin:0 auto;padding:1.5rem 1rem 3rem;color:var(--muted);font-size:.85rem;border-top:1px solid var(--line)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--accent) 10%,rgba(10,12,16,.55));display:flex;justify-content:center;align-items:flex-end;
  animation:fade .2s ease}
.overlay[hidden]{display:none}
.sheet{background:var(--bg);width:100%;max-width:920px;max-height:96vh;overflow:auto;border-radius:18px 18px 0 0;overscroll-behavior:contain}
@media(min-width:760px){.overlay{align-items:center;padding:1.5rem}.sheet{border-radius:18px;max-height:92vh}}
.bar{position:sticky;top:0;z-index:3;display:flex;gap:.4rem;align-items:center;justify-content:space-between;padding:.6rem .8rem;background:color-mix(in srgb,var(--accent) 6%,var(--bg));border-bottom:1px solid var(--line)}
.bar .grp{display:flex;gap:.35rem;flex-wrap:wrap}
.ib{border:1px solid var(--line);background:var(--card);border-radius:999px;min-width:40px;min-height:40px;padding:.2rem .7rem;font-size:.9rem}
.bar .ib svg,#fPrev svg,#fNext svg{display:block}
.bar .ib{width:44px;height:44px;min-width:44px;padding:0;display:inline-grid;place-items:center;font-size:1.15rem;line-height:1}
.bar .grp{gap:.5rem}
.ib:hover{border-color:var(--accent-text)}
.ib[aria-pressed="true"]{color:var(--accent-text);border-color:var(--accent-text)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:1rem;padding:1.2rem 1rem 0;align-items:center}
.bigsym{width:clamp(96px,26vw,150px);aspect-ratio:1;border-radius:20px;background:var(--accent-soft);border:2px solid var(--accent);
  display:flex;flex-direction:column;justify-content:space-between;padding:.5rem .7rem;color:var(--accent-text)}
.bigsym .z{font-size:.95rem;font-weight:600}
.bigsym{container-type:inline-size}
.bigsym .sy.l1{font-size:min(4.4rem,58cqw)}
.bigsym .sy.l2{font-size:min(3.6rem,44cqw)}
.bigsym .sy.l3{font-size:min(2.9rem,33cqw)}
.bigsym .sy{font-size:clamp(2.6rem,10vw,4.4rem);font-weight:700;line-height:1;text-align:center;}
.bigsym .ms{font-size:.8rem;text-align:right;opacity:.85}
.hero h2{margin:0;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.15;letter-spacing:-.015em}
.hero .en{color:var(--muted);font-size:1.05rem}
.hero .lat{margin-top:.3rem;font-size:.9rem;color:var(--muted)}
.body{padding:1rem;display:grid;gap:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1rem}
.card h3{margin:0 0 .6rem;font-size:1rem}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.kv div span{display:block;font-size:.78rem;color:var(--muted)}
.kv div b{font-weight:600}
.txt p{margin:.1rem 0 .7rem;max-width:70ch}
.txt h4{margin:.8rem 0 .15rem;font-size:.92rem;color:var(--accent-text)}
.warn{border-left:4px solid var(--accent);padding-left:.7rem}
.note{font-size:.82rem;color:var(--muted)}
.stat{padding:.7rem 0;border-top:1px solid var(--line)}
.stat:first-of-type{border-top:0;padding-top:0}
.stat .top2{display:flex;justify-content:space-between;gap:.8rem;align-items:baseline;flex-wrap:wrap}
.stat .lab{font-weight:600}
.stat .val{font-variant-numeric:tabular-nums}
.dots{display:inline-flex;gap:4px;vertical-align:middle;margin-right:.4rem}
.dots i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--accent-text);display:inline-block}
.dots i.on{background:var(--accent)}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--line);border-radius:999px;padding:0 .5rem;margin-left:.4rem;color:var(--muted)}
.tag.real{border-color:var(--accent-text);color:var(--accent-text)}
.fact{display:flex;gap:.8rem;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.links a{display:inline-block;margin:.1rem .8rem .1rem 0}
.emptybox{border:1px dashed var(--line);border-radius:12px;padding:1rem;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:999px;z-index:80;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:.8rem 1rem;min-height:52px;margin:.45rem 0;font-size:1.05rem;line-height:1.4}
.opt:disabled{color:var(--ink);opacity:1;cursor:default}
.opt:hover:not(:disabled){border-color:var(--accent-text)}
.opt.ok{border-color:#1f9d55;background:color-mix(in srgb,#1f9d55 16%,var(--card))}
.opt.bad{border-color:#d64545;background:color-mix(in srgb,#d64545 14%,var(--card))}
.qprompt{font-size:clamp(2rem,9vw,3.4rem);font-weight:700;text-align:center;margin:.6rem 0 1rem;line-height:1.2}
.fcard{--accent-soft:color-mix(in srgb,var(--accent) 12%,var(--card));--accent-text:color-mix(in srgb,var(--accent) 72%,#000);width:100%;min-height:280px;border:2px solid var(--accent);border-radius:20px;background:var(--accent-soft);text-align:center;padding:1.2rem;display:flex;flex-direction:column;justify-content:center;gap:.3rem;color:var(--ink)}
:root[data-theme="dark"] .fcard{--accent-text:color-mix(in srgb,var(--accent) 65%,#fff)}
.fcard .sy{font-size:clamp(4rem,20vw,6rem);font-weight:700;line-height:1;color:var(--accent-text)}
.fcard .nm{font-size:1.8rem;font-weight:700}
.badge{font-size:.8rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 .5rem;margin-left:.3rem}
@media(max-width:520px){.modes{grid-template-columns:minmax(0,1fr)}.mode{min-height:56px}.brand{font-size:1.1rem}.btn .lbl,.ib .lbl{display:none}.btn,.ib{padding:.35rem .6rem}.seg button{padding:.35rem .55rem;min-width:36px}.tools{gap:.3rem}.brand small{display:none}.hero{grid-template-columns:1fr;justify-items:start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== iOS-like glass + motion layer ===== */
:root{
  --glass:color-mix(in srgb,var(--card) 68%,transparent);
  --glass-line:rgba(20,24,31,.10);
  --glass-hi:rgba(255,255,255,.92);
  --glass-deep:color-mix(in srgb,var(--card) 55%,transparent);
  /* Apple-style curves */
  --ease:cubic-bezier(.25,.1,.25,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.175,.885,.32,1.1);
  --spring-soft:cubic-bezier(.22,1,.36,1);
  --spring-bounce:cubic-bezier(.34,1.45,.64,1);
  --press:cubic-bezier(.2,0,.2,1);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --pattern-dot:rgba(20,24,31,.045);
  --pattern-line:rgba(20,24,31,.035);
}
:root[data-theme="dark"]{
  --glass-line:rgba(255,255,255,.13);
  --glass-hi:rgba(255,255,255,.14);
  --glass-deep:color-mix(in srgb,var(--card) 48%,transparent);
  --pattern-dot:rgba(255,255,255,.055);
  --pattern-line:rgba(255,255,255,.04);
}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  padding-left:var(--safe-l);padding-right:var(--safe-r);
  overscroll-behavior-y:none;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  /* subtle liquid-glass ambient + micro pattern (dots + soft grid) — opacity kept low so text stays crisp */
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse 120% 80% at 10% -20%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 55%),
    radial-gradient(ellipse 90% 70% at 95% 10%, color-mix(in srgb,var(--accent) 6%,transparent), transparent 50%),
    radial-gradient(circle at 1px 1px, var(--pattern-dot) 1px, transparent 0),
    linear-gradient(var(--pattern-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--pattern-line) 1px, transparent 1px);
  background-size: auto, auto, 18px 18px, 48px 48px, 48px 48px;
  background-attachment: fixed;
}
body.themed{
  background-image:
    radial-gradient(ellipse 120% 80% at 10% -20%, color-mix(in srgb,var(--accent) 14%,transparent), transparent 55%),
    radial-gradient(ellipse 90% 70% at 95% 10%, color-mix(in srgb,var(--accent) 9%,transparent), transparent 50%),
    radial-gradient(circle at 1px 1px, var(--pattern-dot) 1px, transparent 0),
    linear-gradient(var(--pattern-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--pattern-line) 1px, transparent 1px);
}
body.sheet-open{overflow:hidden;touch-action:none}
button,select,input,a,.tile,.chip,.mini,.mode,.opt,.ib{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
header.top{
  padding-top:var(--safe-t);
  background:color-mix(in srgb,var(--bg) 62%,transparent);
  -webkit-backdrop-filter:blur(36px) saturate(2.1);
  backdrop-filter:blur(36px) saturate(2.1);
  border-bottom-color:var(--glass-line);
  box-shadow:0 1px 0 color-mix(in srgb,var(--glass-hi) 40%,transparent);
}
.bar{
  position:sticky;top:0;z-index:3;
  padding:.55rem .8rem calc(.55rem + 2px);
  padding-top:max(.7rem, calc(var(--safe-t) * .1 + .55rem));
  background:color-mix(in srgb,var(--bg) 58%,transparent);
  -webkit-backdrop-filter:blur(36px) saturate(2.1);
  backdrop-filter:blur(36px) saturate(2.1);
  border-bottom-color:var(--glass-line);
}
.bar::before{
  content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
  width:40px;height:5px;border-radius:100px;
  background:color-mix(in srgb,var(--ink) 18%,transparent);
  pointer-events:none;
}
.btn:not(.primary),.ib,.seg,.chip:not([aria-pressed="true"]),.chip2,.mini,.mode,.opt:not(.ok):not(.bad){
  background:var(--glass);border-color:var(--glass-line);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 2px 10px rgba(0,0,0,.06);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);
  backdrop-filter:blur(12px) saturate(1.4);
}
.card,.acc{
  border-radius:18px;border-color:var(--glass-line);
  background:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 28px rgba(0,0,0,.07);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  backdrop-filter:blur(20px) saturate(1.6);
}
.btn.primary{box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 4px 14px rgba(0,0,0,.16)}
.results{
  background:color-mix(in srgb,var(--card) 78%,transparent);
  -webkit-backdrop-filter:blur(36px) saturate(2);
  backdrop-filter:blur(36px) saturate(2);
  border-color:var(--glass-line);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 16px 48px rgba(0,0,0,.14);
}
.toast{
  bottom:calc(1.2rem + var(--safe-b));
  background:color-mix(in srgb,var(--ink) 82%,transparent);
  -webkit-backdrop-filter:blur(28px) saturate(1.9);
  backdrop-filter:blur(28px) saturate(1.9);
  transition:opacity .28s var(--ease),transform .35s var(--spring);
  will-change:opacity,transform;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 10px 32px rgba(0,0,0,.28);
}
.toast[hidden]{display:block!important;opacity:0;transform:translateX(-50%) translateY(14px) scale(.94);pointer-events:none}
.toast:not([hidden]){opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

/* Press feedback — iOS style: fast in, soft out */
.btn,.ib,.mode,.opt,.tile,.mini,.chip,.learn-hub .btn{
  transition:
    transform .32s var(--spring-soft),
    box-shadow .22s var(--ease),
    border-color .2s var(--ease),
    background-color .2s var(--ease),
    opacity .2s var(--ease),
    filter .2s var(--ease);
  -webkit-transform:translateZ(0);transform:translateZ(0);
}
.btn:active,.ib:active,.mode:active,.opt:active:not(:disabled),.mini:active,.chip:active,
.learn-hub .btn:active{
  transform:scale(.97);
  transition-duration:.08s;
  transition-timing-function:var(--press);
  filter:brightness(.97);
}
.tile:active{transform:scale(.96);transition-duration:.07s;transition-timing-function:var(--press)}
.ib:active{transition-duration:.07s}
.tile{will-change:transform}
.seg button{
  transition:background-color .28s var(--spring-soft),color .28s var(--spring-soft),transform .2s var(--spring-soft);
}
.seg button:active{transform:scale(.96)}

/* Overlay + sheet — system sheet feel */
.overlay{
  -webkit-backdrop-filter:blur(22px) saturate(1.7);
  backdrop-filter:blur(22px) saturate(1.7);
  transition:opacity .36s var(--ease-out);
  overscroll-behavior:none;
  background:color-mix(in srgb,var(--accent) 7%,rgba(8,10,14,.52));
}
.overlay[hidden]{display:none}
.sheet{
  will-change:transform;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  padding-bottom:var(--safe-b);
  border-top-width:0;
  background:color-mix(in srgb,var(--bg) 90%,transparent);
  -webkit-backdrop-filter:blur(32px) saturate(1.8);
  backdrop-filter:blur(32px) saturate(1.8);
  box-shadow:0 -16px 56px rgba(0,0,0,.24), inset 0 1px 0 var(--glass-hi);
}
.sheet.enter{animation:sheetIn .48s var(--spring-soft) both}
@keyframes sheetIn{
  from{transform:translate3d(0,104%,0)}
  to{transform:translate3d(0,0,0)}
}
@keyframes rise{from{transform:translate3d(0,24px,0);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.overlay.closing{animation:fadeOut .3s var(--ease) forwards}
.overlay.closing .sheet{animation:sheetOut .34s cubic-bezier(.4,0,.2,1) forwards}
@keyframes fadeOut{to{opacity:0}}
@keyframes sheetOut{to{transform:translate3d(0,110%,0)}}

/* Content enter — staggered feel */
@keyframes viewIn{
  from{opacity:0;transform:translate3d(0,10px,0)}
  to{opacity:1;transform:none}
}
.body.in{animation:viewIn .34s var(--ease-out) both}
.body.swap{animation:none}
@keyframes grow{from{width:0}}
.body.in .pbar i{animation:grow .7s var(--ease-out) both}

/* Quiz feedback — snappy but soft */
@keyframes pop{
  0%{transform:scale(.92)}
  45%{transform:scale(1.06)}
  75%{transform:scale(.98)}
  100%{transform:scale(1)}
}
@keyframes shake{
  10%{transform:translateX(-6px)}
  30%{transform:translateX(6px)}
  50%{transform:translateX(-4px)}
  70%{transform:translateX(3px)}
  100%{transform:none}
}
@keyframes scorePulse{
  0%{transform:scale(1)}
  40%{transform:scale(1.18)}
  100%{transform:scale(1)}
}
@keyframes qIn{
  from{opacity:0;transform:translateY(14px) scale(.97)}
  to{opacity:1;transform:none}
}
@keyframes optIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}
@keyframes modeIn{
  from{opacity:0;transform:translateY(12px) scale(.98)}
  to{opacity:1;transform:none}
}
@keyframes confettiBurst{0%{opacity:1;transform:scale(0)}40%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1.4)}}
.opt.ok{animation:pop .5s var(--spring-bounce)}
.opt.bad{animation:shake .42s var(--ease)}
.chip2.score-up{animation:scorePulse .4s var(--spring-bounce)}
.qbox.qin{animation:qIn .36s var(--ease-out) both}
.opt{animation:optIn .34s var(--ease-out) both}
.opt:nth-child(1){animation-delay:.02s}
.opt:nth-child(2){animation-delay:.05s}
.opt:nth-child(3){animation-delay:.08s}
.opt:nth-child(4){animation-delay:.11s}
.mode{animation:modeIn .38s var(--ease-out) both}
.modes .mode:nth-child(1){animation-delay:.03s}
.modes .mode:nth-child(2){animation-delay:.06s}
.modes .mode:nth-child(3){animation-delay:.09s}
.modes .mode:nth-child(4){animation-delay:.12s}
.modes .mode:nth-child(5){animation-delay:.15s}
.modes .mode:nth-child(6){animation-delay:.18s}
.fb{animation:viewIn .3s var(--ease-out) both}
.fb.ok{position:relative}
.fb.ok::after{
  content:"✓";position:absolute;right:.9rem;top:50%;transform:translateY(-50%);
  font-size:1.4rem;font-weight:700;color:#1f9d55;opacity:.7;
}
.fb{animation:viewIn .28s var(--ease)}
.resbox .stars svg{animation:pop .5s var(--spring-bounce) both}
.resbox .stars svg:nth-child(2){animation-delay:.1s}
.resbox .stars svg:nth-child(3){animation-delay:.2s}
.fcard{transition:transform .18s var(--ease);-webkit-transform-style:preserve-3d;transform-style:preserve-3d}
.fcard.flipOut{transform:perspective(900px) rotateY(90deg)}
.fcard.flipIn{animation:flipIn .26s var(--ease)}
@keyframes flipIn{from{transform:perspective(900px) rotateY(-90deg)}to{transform:perspective(900px) rotateY(0)}}
.table-wrap{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.sheet .body{padding-bottom:calc(1rem + var(--safe-b))}
@media(min-width:760px){
  .sheet.enter{animation-name:sheetInDesk}
  @keyframes sheetInDesk{
    from{transform:translate3d(0,28px,0) scale(.96);opacity:0}
    to{transform:none;opacity:1}
  }
  .overlay.closing .sheet{animation-name:sheetOutDesk}
  @keyframes sheetOutDesk{
    to{transform:translate3d(0,18px,0) scale(.97);opacity:0}
  }
}
@media(hover:hover) and (pointer:fine){
  .tile:hover{transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.16);z-index:2}
  .btn:hover,.ib:hover,.mini:hover,.chip:hover{border-color:var(--accent-text)}
}
@media(hover:none){
  .tile:hover{transform:none;box-shadow:none}
}

/* ===== Professional polish layer ===== */
:root{
  --radius-sm:8px; --radius-md:12px; --radius-lg:16px; --radius-xl:22px;
  --elev-1:0 1px 2px rgba(15,18,23,.04),0 1px 3px rgba(15,18,23,.06);
  --elev-2:0 4px 16px rgba(15,18,23,.08),0 1px 3px rgba(15,18,23,.04);
  --elev-3:0 12px 40px rgba(15,18,23,.14),0 2px 8px rgba(15,18,23,.06);
  --ink-soft:color-mix(in srgb,var(--ink) 78%,var(--muted));
  --tracking:-.02em;
}
:root[data-theme="dark"]{
  --elev-1:0 1px 2px rgba(0,0,0,.2),0 1px 3px rgba(0,0,0,.15);
  --elev-2:0 4px 20px rgba(0,0,0,.35),0 1px 4px rgba(0,0,0,.2);
  --elev-3:0 16px 48px rgba(0,0,0,.45),0 2px 10px rgba(0,0,0,.25);
  --bg:#0c0f14; --card:#141920; --line:#252b36;
}
body{letter-spacing:var(--tracking);text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--accent) 28%,transparent);color:var(--ink)}

/* brand + header */
.brand{font-size:1.2rem;letter-spacing:-.03em;font-weight:700}
.brand small{margin-top:.12rem;opacity:.85;letter-spacing:0;font-size:.68rem}
header.top{border-bottom:1px solid var(--glass-line)}
.top-in{padding:.7rem 1.1rem;max-width:1120px}
.search input{
  border-radius:var(--radius-md);border-color:var(--glass-line);
  background:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--elev-1);min-height:44px;
  -webkit-backdrop-filter:blur(14px) saturate(1.5);
  backdrop-filter:blur(14px) saturate(1.5);
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s;
}
.search input:focus{
  border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent),inset 0 1px 0 var(--glass-hi),var(--elev-1);
  outline:none;
}
.results{border-radius:var(--radius-lg);box-shadow:var(--elev-3);border-color:var(--glass-line);padding:.35rem}
.res{border-radius:var(--radius-sm);transition:background .15s var(--ease)}
.res .sym{border-radius:var(--radius-sm);font-variant-numeric:tabular-nums}

/* buttons */
.btn,.ib{
  border-radius:999px;font-weight:550;
  letter-spacing:-.01em;
  transition:transform .25s var(--spring),box-shadow .2s,border-color .2s,background .2s,opacity .2s;
}
.btn{min-height:42px;padding:.42rem .95rem}
.btn.primary{
  background:var(--ink);color:var(--bg);border-color:transparent;
  font-weight:600;letter-spacing:-.015em;
}
.btn.primary:hover{filter:brightness(1.06)}
.seg{border-radius:999px;padding:2px;gap:0;box-shadow:var(--elev-1)}
.seg button{border-radius:999px;font-size:.82rem;font-weight:650;letter-spacing:.02em;min-height:34px;padding:.3rem .65rem}
.seg button[aria-pressed="true"]{box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* main typography */
main{max-width:1120px;padding:1.15rem 1.1rem 3.5rem}
h1.title{
  font-size:clamp(1.55rem,4.2vw,2.15rem);font-weight:700;
  letter-spacing:-.03em;margin:.5rem 0 .2rem;line-height:1.15;
}
p.lead{font-size:.95rem;line-height:1.55;color:var(--muted);max-width:52ch;margin:0 0 1.15rem}

/* heat + legend */
.heatrow{margin:0 0 1rem;gap:.5rem .75rem}
.heatrow label{font-size:.8rem;font-weight:600;letter-spacing:.01em;text-transform:none;color:var(--muted)}
.heatrow select{
  border-radius:var(--radius-md);min-height:42px;font-size:.92rem;
  background:var(--glass);border-color:var(--glass-line);
  box-shadow:inset 0 1px 0 var(--glass-hi),var(--elev-1);
  -webkit-backdrop-filter:blur(12px) saturate(1.4);
  backdrop-filter:blur(12px) saturate(1.4);
}
.legend{gap:.35rem;margin:0 0 1.1rem}
.chip{
  font-size:.8rem;font-weight:550;min-height:34px;padding:.2rem .7rem;
  border-radius:999px;letter-spacing:-.01em;
  transition:transform .22s var(--spring),background .2s,border-color .2s,color .2s;
}
.chip i{width:.7rem;height:.7rem;box-shadow:0 0 0 1px rgba(0,0,0,.06)}

/* periodic table tiles */
.ptable{gap:4px}
.tile{
  border-radius:var(--radius-sm);
  border:1px solid color-mix(in srgb,var(--ink) 6%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.04);
  padding:3px 4px;
  /* faint liquid sheen — stays behind the numbers/symbols */
  background-image:linear-gradient(155deg, rgba(255,255,255,.22) 0%, transparent 42%, transparent 100%);
  background-blend-mode:soft-light;
}
:root[data-theme="dark"] .tile{
  border-color:color-mix(in srgb,#fff 8%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), inset 0 -1px 0 rgba(0,0,0,.2);
  background-image:linear-gradient(155deg, rgba(255,255,255,.08) 0%, transparent 45%, transparent 100%);
}
.tile .n{font-size:.58rem;font-weight:500;font-variant-numeric:tabular-nums;opacity:.7;letter-spacing:0}
.tile .s{font-size:1.12rem;font-weight:700;letter-spacing:-.03em}
.tile .t{font-size:.52rem;opacity:.85;font-weight:500}
.tile.hit{outline:2.5px solid var(--ink);outline-offset:-2px;box-shadow:0 0 0 1px var(--bg)}
.hint{font-size:.8rem;margin:.5rem 0 0;opacity:.9}

/* cards / accordion */
.card,.acc{
  border-radius:var(--radius-lg);
  background:var(--glass);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 8px 28px rgba(0,0,0,.07);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(20px) saturate(1.6);
  backdrop-filter:blur(20px) saturate(1.6);
}
.card{padding:1.05rem 1.1rem}
.card h3{
  font-size:.78rem;font-weight:650;letter-spacing:.04em;
  text-transform:uppercase;color:var(--muted);margin:0 0 .75rem;
}
.kv{gap:.85rem .9rem}
.kv div span{font-size:.72rem;font-weight:500;letter-spacing:.01em;margin-bottom:.15rem}
.kv div b{font-size:.98rem;font-weight:650;letter-spacing:-.015em;font-variant-numeric:tabular-nums}
.acc summary{font-size:1rem;font-weight:650;letter-spacing:-.015em;padding:1rem 1.1rem}
.acc-body{padding:0 1.1rem 1.1rem}
.pill{font-size:.7rem;letter-spacing:.02em;padding:.15rem .55rem}

/* sheet detail */
.sheet{
  border-radius:20px 20px 0 0;
  box-shadow:var(--elev-3);
  max-width:880px;
}
@media(min-width:760px){.sheet{border-radius:var(--radius-xl)}}
.bar{padding:.65rem .9rem .55rem}

/* Meaningful heat scales: t in [0,1] → {bg, ink} */
function heatColor(scale, t, dark){
  t=Math.max(0, Math.min(1, t));
  // low → high
  if(scale==="mp"){
    // cold blue → warm yellow → hot red
    const h=210-t*210; // 210→0
    const s=55+t*30;
    const l=dark ? (28+t*8) : (92-t*42);
    return {bg:`hsl(${h} ${s}% ${l}%)`, ink: (!dark && l>58) || (dark && l<40) ? (dark?"#eceff4":"#14181f") : (l>55?"#14181f":"#fff")};
  }
  if(scale==="dens"){
    // airy sky → dense deep indigo
    const h=200-t*40; // 200→160
    const s=35+t*35;
    const l=dark ? (30-t*8) : (94-t*48);
    return {bg:`hsl(${h} ${s}% ${l}%)`, ink:l>(dark?36:55)?"#14181f":"#f5f7fa"};
  }
  if(scale==="mass"){
    // light silver → heavy slate
    const h=230, s=18+t*25, l=dark?(32-t*6):(93-t*45);
    return {bg:`hsl(${h} ${s}% ${l}%)`, ink:l>(dark?36:55)?"#14181f":"#f5f7fa"};
  }
  if(scale==="en"){
    // low EN soft teal → high EN vivid violet
    const h=165+t*110; // 165→275
    const s=40+t*35;
    const l=dark ? (30+t*4) : (90-t*38);
    return {bg:`hsl(${h} ${s}% ${l}%)`, ink:l>(dark?38:55)?"#14181f":"#f5f7fa"};
  }
  if(scale==="crust"){
    // rare (low) purple → abundant (high) green
    const h=280-t*200; // 280→80
    const s=40+t*20;
    const l=dark ? (28+t*6) : (90-t*35);
    return {bg:`hsl(${h} ${s}% ${l}%)`, ink:l>(dark?36:55)?"#14181f":"#f5f7fa"};
  }
  // fallback blue
  const l=dark?(30):(92-t*35);
  return {bg:`hsl(215 65% ${l}%)`, ink:l>55?"#14181f":"#fff"};
}
function heatGradient(scale, dark){
  const a=heatColor(scale,0,dark).bg, b=heatColor(scale,0.5,dark).bg, c=heatColor(scale,1,dark).bg;

}
function applyHeat(){
  const h=HEAT[state.heat], bar=$("#heatBar"); const tiles=document.querySelectorAll(".tile");

  if(!h){tiles.forEach(b=>{b.style.background="";b.style.color=""});bar.innerHTML="";return}
  const tr=h.log?Math.log10:(x=>x), ok=v=>v!=null&&isFinite(v)&&(!h.log||v>0);
  const vals=EL.map(e=>h.f(e)).filter(ok);
  if(!vals.length){tiles.forEach(b=>{b.style.background="var(--line)";b.style.color="var(--muted)"});bar.innerHTML=esc(T().L.heatNoData);return}
  const lo=Math.min(...vals.map(tr)), hi=Math.max(...vals.map(tr));
  tiles.forEach(b=>{
    const v=h.f(EL[b.dataset.z-1]);
    if(!ok(v)){b.style.background="var(--line)";b.style.color="var(--muted)";return}
    const t=(tr(v)-lo)/((hi-lo)||1);
    const col=heatColor(h.scale, t, dark);

  });

}

function rankMatches(q){
  q=q.trim().toLowerCase(); if(!q) return [];
  const score=e=>{
    if(/^\d+$/.test(q)) return String(e.z)===q?0:9;
    if(e.sym.toLowerCase()===q) return 0;
    if(e.en.toLowerCase()===q||e.th===q) return 1;
    if(e.en.toLowerCase().startsWith(q)||e.th.startsWith(q)) return 2;
    if(e.sym.toLowerCase().startsWith(q)) return 3;
    if(e.en.toLowerCase().includes(q)||e.th.includes(q)) return 4;
    return 9;
  };
  return EL.map(e=>[score(e),e]).filter(x=>x[0]<9).sort((a,b)=>a[0]-b[0]||a[1].z-b[1].z).map(x=>x[1]);
}

/* แสดงภาพที่สร้างเสร็จ แล้วให้ผู้ใช้กดปุ่มแชร์เอง (iOS/Safari ต้องเรียกแชร์จากการแตะโดยตรง ไม่งั้นถูกบล็อก) */
function showCardPreview(file,title,th){
  const url=URL.createObjectURL(file);
  const old=document.getElementById("cardPrev"); if(old) old.remove();
  const o=document.createElement("div"); o.id="cardPrev"; o.setAttribute("role","dialog"); o.setAttribute("aria-modal","true");
  o.style.cssText="position:fixed;inset:0;z-index:100000;background:rgba(8,10,14,.84);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)";
  o.innerHTML=`<img alt="" src="${url}" style="max-width:100%;max-height:calc(100vh - 190px);max-height:calc(100dvh - 190px);object-fit:contain;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5)"><div style="color:#cfd6df;font-size:.85rem;text-align:center;line-height:1.5">${th?"กดค้างที่ภาพเพื่อเลือก “บันทึกลงรูปภาพ” หรือกดปุ่มด้านล่าง":"Press and hold the image to save it, or use the button below"}</div><div style="display:flex;gap:10px"><button type="button" class="btn primary" id="cpShare" style="background:var(--accent,#3b82f6);border-color:transparent;color:#fff;min-height:46px;padding:.5rem 1.2rem;font-weight:600">${th?"แชร์ / บันทึกภาพ":"Share / Save image"}</button><button type="button" class="btn" id="cpClose" style="background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.25);color:#fff;min-height:46px;padding:.5rem 1.2rem">${th?"ปิด":"Close"}</button></div>`;
  const close=()=>{ o.remove(); document.removeEventListener("keydown",onKey); setTimeout(()=>URL.revokeObjectURL(url),1000); };
  const onKey=ev=>{ if(ev.key==="Escape") close(); };
  document.addEventListener("keydown",onKey);
  o.addEventListener("click",ev=>{ if(ev.target===o) close(); });
  document.body.appendChild(o);
  o.querySelector("#cpClose").onclick=close;
  o.querySelector("#cpShare").onclick=async()=>{
    try{
      if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title}); return; }
    }catch(err){ if(err&&err.name==="AbortError") return; }
    const a=document.createElement("a"); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove();
  };
}

  const featured=[["mix",L.mix,318,"🎲"],["sprint",L.sprint,345,"⚡"],["hint",L.hintQ,228,"💡"]];
  const more=[["s2n",L.s2n,8],["n2s",L.n2s,30],["num",L.num,48],["cat",L.cat,150],["phase",L.phase,200],["lat",L.latQ,275]];
  const goalMsg = kn===0 ? L.startHint : (kn<20 ? (state.lang==="th"?`อีก ${20-kn} ธาตุ ถึงระดับง่ายครบ`:`${20-kn} more to finish the easy set`) : (kn<54 ? (state.lang==="th"?`อีก ${54-kn} ธาตุ ถึงระดับกลาง`:`${54-kn} more to medium set`) : (kn<118 ? (state.lang==="th"?`อีก ${118-kn} ธาตุ เก็บครบ`:`${118-kn} left to collect them all`) : (state.lang==="th"?"เก็บครบทั้งตารางแล้ว!":"Full table collected!"))));
  learnShell(`<div class="card hero2">
    <div style="display:flex;align-items:baseline;justify-content:space-between;gap:.5rem">
      <span><span class="bignum">${kn}</span><span class="of">/118</span></span>
      <span class="note">${esc(L.known)}</span>
    </div>
    <div class="pbar" aria-hidden="true"><i style="width:${Math.round(kn/118*100)}%"></i></div>
    <p class="note" style="margin:.15rem 0 .75rem">${esc(goalMsg)}</p>
    ${tiles.length?`<div class="stats3" style="grid-template-columns:repeat(${tiles.length},minmax(0,1fr));margin-bottom:.75rem">${tiles.map(([v,l])=>`<div><b>${esc(v)}</b><span class="note">${esc(l)}</span></div>`).join("")}</div>`:""}
    <button class="btn primary bigbtn" id="lQuick">${ICON.play}<span>${esc(L.quick)}</span></button>
  </div>

  <div class="card">
    <h3>${state.lang==="th"?"โหมดฮิต":"Popular modes"}</h3>
    <div class="modes" style="margin-top:.35rem">${featured.map(([k,l,h,ico])=>`<button class="mode" data-q="${k}" style="border-left:5px solid hsl(${h} 60% 55%)"><span style="font-size:1.15rem;margin-right:.35rem">${ico}</span>${esc(l)}<span class="note" style="display:block;font-weight:400;margin-top:.15rem">${esc(L["dm_"+k])}</span></button>`).join("")}</div>
  </div>

  <div class="card">
    <h3>${esc(L.quiz)}</h3>
    <div class="note" style="margin:.1rem 0 .4rem">${esc(L.lvH)}</div>
    <div class="seg full" role="group" aria-label="${esc(L.lvH)}">${[[20,L.lvEasy],[54,L.lvMid],[118,L.lvAll]].map(([v,l])=>`<button data-lv="${v}" aria-pressed="${learn.max===v}">${esc(l)}</button>`).join("")}</div>
    <p class="note" style="margin:.55rem 0 .7rem">${esc(L["lvD"+learn.max]||"")}</p>
    <div class="modes">${more.map(([k,l,h])=>`<button class="mode" data-q="${k}" style="border-left:5px solid hsl(${h} 60% 55%)">${esc(l)}<span class="note" style="display:block;font-weight:400">${esc(L["dm_"+k])}</span></button>`).join("")}</div>
  </div>

  <div class="card">
    <h3>${esc(L.flash)}</h3>
    <div class="stack">
      <select id="lCat" class="btn" aria-label="${esc(L.deck)}"><option value="">${esc(L.allCats)}</option>${Object.keys(CATS).map(c=>`<option value="${c}">${esc(T().cat[c])}</option>`).join("")}</select>
      <button class="btn primary" id="lFlash">${esc(L.start)}</button>
    </div>
  </div>

  <div class="card">
    <h3>${esc(L.wrong)}</h3>
    ${w.length?`<div class="row" id="lWrong"></div><p style="margin:.7rem 0 0" class="row"><button class="btn primary" id="lRevWrong">${esc(L.reviewWrong)}</button><button class="ib" id="lClear">${esc(L.clear)}</button></p>`:`<div class="emptybox">${esc(L.wrongEmpty)}</div>`}
  </div>`,"menu");
  $("#lQuick").onclick=()=>startQuiz("mix");
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{learn.max=+b.dataset.lv; store.set("el_lv",learn.max); learnMenu()});
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.q));
  $("#lFlash").onclick=()=>startFlash($("#lCat").value||null);
  const box=$("#lWrong"); if(box) w.forEach(([sym,n])=>{const e=BY_SYM[sym.toLowerCase()]; if(!e) return; const m=miniBtn(e); m.insertAdjacentHTML("beforeend",`<span class="badge">×${n}</span>`); box.appendChild(m)});
  const rw=$("#lRevWrong"); if(rw) rw.onclick=()=>startFlashList(w.map(x=>x[0]));
  const c=$("#lClear"); if(c) c.onclick=()=>{store.set("el_wrong",{});store.set("el_stats",{n:0,c:0});learnMenu()};
  $("#sheet").focus();
}
// คำใบ้ของธาตุหนักยิ่งยวด (Z>=100) ซ้ำกันมาก จึงไม่นำมาออกข้อสอบแบบคำใบ้
const hintOK=x=>!!FEATURED[x.sym]&&x.z<100;
function buildQ(e,k){
  if(k==="cat") return {e,k,ans:e.cat,opts:shuffle([e.cat,...shuffle(Object.keys(CATS).filter(c=>c!==e.cat)).slice(0,ND())])};
  if(k==="phase") return {e,k,ans:e.phase,opts:["s","l","g"]};
  if(k==="lat"){const a=LATIN[e.sym]; return {e,k,ans:a,opts:shuffle([a,...shuffle(Object.values(LATIN).filter(x=>x!==a)).slice(0,ND())])}}
  const base=(k==="hint"?EL.filter(x=>x.cat!==e.cat&&hintOK(x)):EL).filter(inLv);
  return {e,k,opts:shuffle([e,...shuffle(base.filter(x=>x.z!==e.z)).slice(0,ND())])};
}
function startQuiz(kind){
  learn.kind=kind; learn.i=0; learn.score=0; learn.picked=null; learn.missed=[];
  const sp=kind==="sprint", mk=["s2n","n2s","num"];
  const pool=(kind==="lat"?Object.keys(LATIN).map(k=>BY_SYM[k.toLowerCase()]):kind==="phase"?EL.filter(x=>x.phase!=="u"):kind==="cat"?EL.filter(x=>x.z<104):kind==="hint"?EL.filter(hintOK):EL).filter(x=>kind==="lat"||inLv(x));
  learn.qs=shuffle(pool).slice(0,sp?80:10).map(e=>buildQ(e,(kind==="mix"||sp)?mk[Math.floor(Math.random()*3)]:kind));
  if(sp) learn.end=Date.now()+60000;
  renderQ();
}
function isRight(q,i){return q.ans!==undefined?q.opts[i]===q.ans:q.opts[i].z===q.e.z}
function optLabel(q,o){if(q.k==="lat") return o; if(q.k==="hint") return nameOf(o); if(q.k==="cat") return T().cat[o]; if(q.k==="phase") return T().phases[o]; return q.k==="s2n"?nameOf(o):q.k==="n2s"?o.sym:String(o.z)}
function renderQ(){
  const L=T().L;
  if(learn.i>=learn.qs.length) return renderResult();
  const q=learn.qs[learn.i], e=q.e, answered=learn.picked!==null, sp=learn.kind==="sprint";
  const hf=FEATURED[e.sym], prompt=q.k==="s2n"||q.k==="lat"?e.sym:q.k==="hint"?hf[state.lang].sum+" "+hf[state.lang].use:nameOf(e), ptxt=q.k==="hint"?L.pHint:q.k==="lat"?L.pLat:q.k==="s2n"?L.pS2N:q.k==="n2s"?L.pN2S:q.k==="cat"?L.pCat:q.k==="phase"?L.pPh:L.pNum;
  const right=answered&&isRight(q,learn.picked);
  learnShell(`<div class="chips2"><span class="chip2">${sp?`<span class="timer" id="sTime"></span>`:`${esc(L.q)} ${learn.i+1}/${learn.qs.length}`}</span><span class="chip2">${esc(L.score)} ${learn.score}</span></div>
   ${sp?"":`<div class="pbar" aria-hidden="true"><i style="width:${Math.round((learn.i+(answered?1:0))/learn.qs.length*100)}%"></i></div>`}
   <div class="qbox${answered?"":" qin"}"><div class="qprompt" id="qp" style="margin:0 0 .3rem;${q.k==="hint"?"font-size:1.2rem;font-weight:600":""}">${esc(prompt)}</div><div class="note">${esc(ptxt)}</div></div>
   <div role="group" aria-labelledby="qp">${q.opts.map((o,i)=>{
     const ok=answered&&isRight(q,i), bad=answered&&i===learn.picked&&!isRight(q,i);
     return `<button class="opt ${ok?"ok":""} ${bad?"bad":""}" data-i="${i}" ${answered?"disabled":""}><span class="kb">${i+1}</span><span>${esc(optLabel(q,o))}${ok?" ✓":""}${bad?" ✗":""}</span></button>`}).join("")}</div>
   ${answered&&!sp?`<div class="fb ${right?"ok":"bad"}" role="status"><b>${esc(right?L.ok:L.no)}</b> · ${esc(nameOf(e))} (${e.sym}, ${e.z})<div class="note" style="margin-top:.3rem">${esc(L.didYou)}: ${esc(((FEATURED[e.sym]||{facts:[{}]}).facts[0]||{})[state.lang]||"")}</div></div><button class="btn primary bigbtn" id="qNext"><span>${esc(learn.i+1>=learn.qs.length?L.finish:L.next)}</span>${ICON.next}</button>`:""}`,"quiz",null,answered);
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pickOpt(+b.dataset.i));
  if(sp){
    const tick=()=>{const left=Math.max(0,Math.ceil((learn.end-Date.now())/1000)); const el=$("#sTime"); if(el) el.textContent=left+" "+L.sec;
      if(left<=0){clearInterval(learn.timer); if(learn.mode==="quiz") renderResult();}};
    tick(); learn.timer=setInterval(tick,250);
  }
  const n=$("#qNext"); if(n){n.onclick=()=>{learn.i++;learn.picked=null;renderQ()};n.focus({preventScroll:true}); if(n.scrollIntoView) n.scrollIntoView({block:"nearest"})}
}

function pickOpt(i){
  if(learn.mode!=="quiz"||learn.picked!==null) return;
  const q=learn.qs[learn.i]; if(!q||i<0||i>=q.opts.length) return;
  learn.picked=i;
  const ok=isRight(q,i);
  if(ok){learn.score++; markKnown(q.e.sym)}
  else{ learn.missed.push(q.e.sym); const w=store.get("el_wrong",{}); w[q.e.sym]=(w[q.e.sym]||0)+1; store.set("el_wrong",w); }
  const st=store.get("el_stats",{n:0,c:0}); st.n++; if(ok) st.c++; store.set("el_stats",st);
  if(learn.kind==="sprint") setTimeout(()=>{ if(learn.mode==="quiz"&&learn.kind==="sprint"&&learn.picked!==null){learn.i++;learn.picked=null;renderQ()} },450);
  renderQ();
  if(ok){
    const chips=document.querySelectorAll(".chip2");
    const scoreChip=[...chips].find(c=>/^\D*\d+\D*$/.test(c.textContent.replace(/\s/g,""))||c.textContent.includes(String(learn.score)));
    if(scoreChip){ scoreChip.classList.remove("score-up"); void scoreChip.offsetWidth; scoreChip.classList.add("score-up"); }
  }
}
function renderResult(){
  const L=T().L, sp=learn.kind==="sprint", bk=sp?"el_best_sprint":"el_best", best=store.get(bk,null), done=learn.i+(learn.picked!==null?1:0), sc=learn.score, tier=sp?(sc>=15?3:sc>=10?2:sc>=5?1:0):(sc>=9?3:sc>=7?2:sc>=4?1:0);
  if(best===null||learn.score>best) store.set(bk,learn.score);
  const total=sp?done:learn.qs.length;
  learnShell(`<div class="card resbox"><div class="stars" role="img" aria-label="${tier}/3">${[1,2,3].map(i=>i<=tier?ICON.starOn:ICON.star).join("")}</div>
   <div class="bigscore">${sc}<span class="of">/${total}</span></div>
   <p style="margin:0 0 .3rem;font-weight:600">${esc(L["msg"+tier])}${!sp&&sc===learn.qs.length?" · "+esc(L.perfect):""}</p>
   <p class="note" style="margin:0">${esc(L.best)}: ${Math.max(best||0,sc)}${sp?"":"/10"}</p></div>
   ${learn.missed.length?`<div class="card"><h3>${esc(L.missed)}</h3><div class="row" id="rMiss"></div></div>`:""}
   <div class="stack"><button class="btn primary bigbtn" id="rAgain"><span>${esc(L.again)}</span></button>${learn.missed.length?`<button class="btn" id="rFlash">${esc(L.reviewWrong)}</button>`:""}<button class="btn" id="rMenu">${esc(L.menu)}</button></div>`,"result");
  const box=$("#rMiss"); if(box) [...new Set(learn.missed)].forEach(x=>box.appendChild(miniBtn(BY_SYM[x.toLowerCase()])));
  const rf=$("#rFlash"); if(rf) rf.onclick=()=>startFlashList([...new Set(learn.missed)]);
  $("#rAgain").onclick=()=>startQuiz(learn.kind); $("#rMenu").onclick=learnMenu;
}
function startFlashList(syms){learn.flist=syms.map(x=>BY_SYM[String(x).toLowerCase()]).filter(Boolean); if(!learn.flist.length) return; startFlash()}
function startFlash(cat){if(cat!==undefined){learn.fcat=cat;learn.flist=null} {const d=learn.flist||(learn.fcat?EL.filter(x=>x.cat===learn.fcat):EL), f=d.filter(inLv); learn.deck=shuffle(learn.flist||!f.length?d:f)}learn.ci=0;learn.flip=false;renderFlash()}
function renderFlash(enter){
  const L=T().L,t=T(),e=learn.deck[learn.ci], sd=learn.fdir==="s";
  const symB=`<span class="sy">${e.sym}</span>`,nameB=`<span class="nm">${esc(nameOf(e))}</span>`,info=`<span class="note">${e.z} · ${esc(t.cat[e.cat])}</span><span class="note">${esc(altName(e))}</span><span>${esc(t.mass)}: ${esc(e.mass)}</span>`,hint=`<span class="note">${esc(L.flip)}</span>`;
  const face=learn.flip?(sd?nameB+info:symB+info):(sd?symB:nameB)+hint;
  learnShell(`<div class="pbar" aria-hidden="true"><i style="width:${Math.round((learn.ci+1)/learn.deck.length*100)}%"></i></div>
   <button class="fcard${enter?" flipIn":""}" id="fc" style="--accent:${accentOf(e)}" aria-label="${esc(L.flip)}">${face}</button>
   ${learn.flip?`<div class="two"><button class="btn" id="fNo">${esc(L.iUnsure)}</button><button class="btn primary" id="fYes">${esc(L.iKnow)}</button></div>`:""}
   <div class="chips2"><button class="ib" id="fPrev" aria-label="${esc(t.prev)}">${ICON.prev}</button><span class="chip2" aria-live="polite">${learn.ci+1}/${learn.deck.length}</span><button class="ib" id="fNext" aria-label="${esc(t.next)}">${ICON.next}</button></div>
   <div class="row" style="justify-content:center"><button class="ib" id="fShuf">${esc(L.shuffle)}</button><button class="ib" id="fDir">${esc(learn.fdir==="s"?L.fdirS:L.fdirN)}</button></div>`,"flash");
  $("#fc").onclick=()=>{ if(RM()){learn.flip=!learn.flip;renderFlash();return} $("#fc").classList.add("flipOut"); setTimeout(()=>{learn.flip=!learn.flip;renderFlash(true)},170); };
  $("#fPrev").onclick=()=>fStep(-1); $("#fNext").onclick=()=>fStep(1); $("#fShuf").onclick=()=>startFlash(); $("#fDir").onclick=()=>{learn.fdir=learn.fdir==="s"?"n":"s";learn.flip=false;renderFlash()};
  const y=$("#fYes"),n=$("#fNo"); if(y) y.onclick=()=>fMark(true); if(n) n.onclick=()=>fMark(false);
  $("#fc").focus({preventScroll:true});
}
function fMark(ok){ const e=learn.deck[learn.ci]; if(ok) markKnown(e.sym); else { const w=store.get("el_wrong",{}); w[e.sym]=(w[e.sym]||0)+1; store.set("el_wrong",w); } fStep(1); }
function fStep(d){ if(learn.mode!=="flash") return; learn.ci=(learn.ci+d+learn.deck.length)%learn.deck.length; learn.flip=false; renderFlash(); }

/* ============ ROUTING ============ */
function route(){
  const h=location.hash||"";
  let m=h.match(/^#\/element\/([A-Za-z]{1,3})$/);
  if(m){ openElement(m[1],{noHash:true}); return }
  if(h==="#/random"){ randomElement(); return }
  if(h==="#/learn"){ learnMenu(); return }
  if(!$("#overlay").hidden && !h){ /* leave open */ }
}

/* ============ EVENTS ============ */
function bind(){
  { const sh=$("#sheet"); let ty=null, dy=0, lastY=0, lastT=0, vel=0;
    const ov=$("#overlay");
    sh.addEventListener("touchstart",ev=>{
      if(!ev.target.closest(".bar")) return;
      const t=ev.touches[0];
      ty=t.clientY; dy=0; lastY=ty; lastT=performance.now(); vel=0;
      sh.style.transition="none"; sh.style.animation="none";
      if(ov) ov.style.transition="none";
    },{passive:true});
    sh.addEventListener("touchmove",ev=>{
      if(ty===null) return;
      const t=ev.touches[0], now=performance.now();
      dy=Math.max(0, t.clientY-ty);
      // rubber-band resistance past mid-screen
      const resist = dy>180 ? 180+(dy-180)*0.35 : dy;
      const dt=Math.max(1, now-lastT);
      vel=(t.clientY-lastY)/dt; lastY=t.clientY; lastT=now;
      sh.style.transform="translate3d(0,"+resist+"px,0)";
      if(ov) ov.style.opacity=String(Math.max(0.25, 1-resist/420));
    },{passive:true});
    sh.addEventListener("touchend",()=>{
      if(ty===null) return;
      const dismiss = dy>120 || (dy>48 && vel>0.45);
      sh.style.transition="transform .38s cubic-bezier(.32,.72,0,1), opacity .28s ease";
      if(ov) ov.style.transition="opacity .32s cubic-bezier(.32,.72,0,1)";
      if(dismiss){
        sh.style.transform="translate3d(0,110%,0)";
        if(ov) ov.style.opacity="0";
        closeSheet();
      } else {
        sh.style.transform="";
        if(ov) ov.style.opacity="";
      }
      ty=null; dy=0; vel=0;
      setTimeout(()=>{ if(sh) sh.style.animation=""; }, 400);
    },{passive:true});
    // cancel if touch leaves
    sh.addEventListener("touchcancel",()=>{
      if(ty===null) return;
      sh.style.transition="transform .32s cubic-bezier(.32,.72,0,1)";
      sh.style.transform=""; if(ov){ ov.style.transition="opacity .28s ease"; ov.style.opacity=""; }
      ty=null;
    },{passive:true});
  }
  $("#q").addEventListener("input",ev=>{state.query=ev.target.value;updateDim();renderResults(!!ev.target.value?false:!$("#results").hidden)});
  $("#q").addEventListener("focus",()=>{ if(!state.query.trim()) renderResults(true); });
  $("#q").addEventListener("keydown",ev=>{
    if(ev.key==="ArrowDown"){ev.preventDefault();moveRes(1)}
    else if(ev.key==="ArrowUp"){ev.preventDefault();moveRes(-1)}
    else if(ev.key==="Enter"){const it=document.querySelectorAll(".res")[Math.max(state.activeRes,0)]; if(it){ev.preventDefault();closeResults();openElement(it.dataset.sym)}}
    else if(ev.key==="Escape"){closeResults()}
  });
  $("#qClear").onclick=()=>{state.query="";$("#q").value="";updateDim();renderResults();$("#q").focus()};
  document.addEventListener("click",ev=>{ if(!ev.target.closest(".search")) closeResults() });
  $("#heat").onchange=ev=>{state.heat=ev.target.value||null;applyHeat()};
  $("#btnQuick").onclick=()=>{state.lastFocus=$("#btnQuick");startQuiz("mix")};
  $("#btnLearn").onclick=()=>{state.lastFocus=$("#btnLearn");learnMenu()};
  $("#btnRandom").onclick=()=>{state.lastFocus=$("#btnRandom");randomElement()};
  $("#btnLang").onclick=()=>setLang(state.lang==="th"?"en":"th");
  $("#btnDark").onclick=()=>setDark(!state.dark);
  $("#overlay").addEventListener("click",ev=>{ if(ev.target.id==="overlay") closeSheet() });
  document.addEventListener("keydown",ev=>{
    if($("#overlay").hidden){
      if(ev.key==="/" && document.activeElement!==$("#q")){ev.preventDefault();$("#q").focus()}
      return;
    }
    if(ev.key==="Escape"){closeSheet()}
    else if(learn.mode==="quiz"&&/^[1-4]$/.test(ev.key)){pickOpt(+ev.key-1)}
    else if(learn.mode==="flash"&&ev.key==="ArrowRight"){fStep(1)}
    else if(learn.mode==="flash"&&ev.key==="ArrowLeft"){fStep(-1)}
    else if(ev.key==="ArrowRight"&&state.current&&!ev.target.closest("input")){step(1)}
    else if(ev.key==="ArrowLeft"&&state.current&&!ev.target.closest("input")){step(-1)}
    else if(ev.key==="Tab"){ // focus trap
      const f=[...$("#sheet").querySelectorAll("button,a[href]")].filter(n=>!n.disabled); if(!f.length) return;
      const first=f[0],last=f[f.length-1];
      if(ev.shiftKey&&(document.activeElement===first||document.activeElement===$("#sheet"))){ev.preventDefault();last.focus()}
      else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
    }
  });
  window.addEventListener("hashchange",route);
}
function setLang(l){
  state.lang=l; store.set("el_lang",l);
  renderStatic(); renderHeatSelect(); renderLegend(); renderTable(); renderLists(); renderResults();
  if(state.current) renderSheet();
  else if(learn.mode==="menu") learnMenu(); else if(learn.mode==="quiz") renderQ(); else if(learn.mode==="flash") renderFlash(); else if(learn.mode==="result") renderResult();
}

/* ============ INIT ============ */
function init(){
  setDark(!!state.dark); renderStatic(); renderHeatSelect(); renderLegend(); renderTable(); renderLists(); bind(); route();
  if(!storageOK) toast(T().errStore);
}
init();
</script>
